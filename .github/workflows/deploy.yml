name: Deploy and Sync to Firefox AMO

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag, e.g., v4.0.1
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install pnpm package manager
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Adjust to 8 if you are using pnpm v8 locally

      # Setup Node.js with pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Install dependencies cleanly using pnpm-lock.yaml
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Build the WebExtension using pnpm
      - name: Build Extension (Firefox)
        run: pnpm wxt build --browser firefox

      # Upload to AMO and attempt to sign/download the .xpi
      # This step dynamically finds your build folder (supports firefox-mv2 or firefox-mv3)
      - name: Submit to Firefox AMO
        id: web-ext-submit
        run: |
          # Dynamically detect the build directory starting with "firefox-"
          FIREFOX_DIR=$(find .output -maxdepth 1 -type d -name "firefox-*" | head -n 1)
          echo "Found build directory: $FIREFOX_DIR"
          
          pnpm dlx web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=listed \
            --source-dir="$FIREFOX_DIR" \
            || echo "Submission completed, but immediate signing/download timed out or requires manual review."

      # Upload the signed .xpi as a GitHub Action Artifact if it was successfully downloaded
      - name: Upload Signed XPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-signed-xpi
          path: web-ext-artifacts/*.xpi
          if-no-files-found: warn

      # Run the script to sync your README to the store page
      - name: Sync README to Store Description
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: ${{ secrets.AMO_ADDON_ID }}
        run: |
          pnpm add jsonwebtoken
          node .github/scripts/sync-description.js