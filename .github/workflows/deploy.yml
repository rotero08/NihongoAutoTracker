name: Deploy and Sync to Firefox AMO

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag, e.g., v4.0.1
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full tag history to read release notes

      # Safety Check: Verify that the pushed tag matches wxt.config.ts
      - name: Validate Version Match
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          CLEAN_TAG_VERSION="${TAG_VERSION#v}" # Strip 'v' prefix
          
          # Extract version string from wxt.config.ts
          WXT_VERSION=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('wxt.config.ts', 'utf8');
            const match = content.match(/version:\s*['\"\`]([^'\"\`]+)['\"\`]/);
            if (match) {
              console.log(match[1]);
            } else {
              process.exit(1);
            }
          ")
          
          echo "Pushed Tag Version: $CLEAN_TAG_VERSION"
          echo "WXT Config Version: $WXT_VERSION"
          
          if [ "$CLEAN_TAG_VERSION" != "$WXT_VERSION" ]; then
            echo "❌ ERROR: The pushed git tag ($CLEAN_TAG_VERSION) does not match the version inside wxt.config.ts ($WXT_VERSION)!"
            echo "Please use the 'pnpm release' command to automatically keep your tag and files synchronized."
            exit 1
          fi
          echo "✅ Version validation passed."

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension (Firefox)
        run: pnpm wxt build --browser firefox

      # Submit to Firefox AMO and sign/download
      - name: Submit to Firefox AMO
        id: web-ext-submit
        run: |
          FIREFOX_DIR=$(find .output -maxdepth 1 -type d -name "firefox-*" | head -n 1)
          echo "Found build directory: $FIREFOX_DIR"
          
          pnpm dlx web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=listed \
            --source-dir="$FIREFOX_DIR" \
            || echo "Submission completed, but immediate signing/download timed out or requires manual review."

      - name: Upload Signed XPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-signed-xpi
          path: web-ext-artifacts/*.xpi
          if-no-files-found: warn

      # Create/Update GitHub Release and upload XPI matching user's selections
      - name: Attach XPI to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XPI_FILE=$(find web-ext-artifacts -name "*.xpi" | head -n 1)
          if [ -n "$XPI_FILE" ]; then
            echo "Signed XPI found: $XPI_FILE"
            
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG_NAME="${{ github.ref_name }}"
            else
              VERSION=$(node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8')); console.log(pkg.version);")
              TAG_NAME="v$VERSION"
            fi
            echo "Target Release Tag: $TAG_NAME"

            # Retrieve tag annotation, stripping Git comments starting with '#'
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" | sed '/^#/d')

            # Extract clean notes by filtering out any line containing RELEASE_TYPE
            CLEAN_NOTES=$(echo "$TAG_MSG" | grep -v "RELEASE_TYPE:")

            # Check if release already exists (for robust re-runs)
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME already exists. Uploading asset..."
              gh release upload "$TAG_NAME" "$XPI_FILE" --clobber
            else
              if echo "$TAG_MSG" | grep -q "RELEASE_TYPE: PUBLIC"; then
                echo "Detected PUBLIC release"
                gh release create "$TAG_NAME" "$XPI_FILE" \
                  --title "$TAG_NAME" \
                  --notes "$CLEAN_NOTES"
              elif echo "$TAG_MSG" | grep -q "RELEASE_TYPE: DRAFT"; then
                echo "Detected DRAFT release"
                gh release create "$TAG_NAME" "$XPI_FILE" \
                  --title "$TAG_NAME" \
                  --draft \
                  --notes "$CLEAN_NOTES"
              else
                echo "⚠️ Untagged release type or manually pushed tag. Defaulting to DRAFT release for safety..."
                gh release create "$TAG_NAME" "$XPI_FILE" \
                  --title "$TAG_NAME" \
                  --draft \
                  --notes "$TAG_MSG"
              fi
            fi
          else
            echo "No signed XPI file found. Skipping release attachment."
          fi

      # Sync listing description to Firefox AMO store page
      - name: Sync Store Description
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: ${{ secrets.AMO_ADDON_ID }}
        run: node .github/scripts/sync-description.js
