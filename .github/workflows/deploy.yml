name: Deploy and Sync to Firefox AMO

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag, e.g., v4.0.1
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full git history to read annotated tag messages

      # Install pnpm package manager
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node.js with pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Install dependencies cleanly using pnpm-lock.yaml (includes jsonwebtoken)
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Build the WebExtension using pnpm
      - name: Build Extension (Firefox)
        run: pnpm wxt build --browser firefox

      # Upload to AMO and attempt to sign/download the .xpi
      - name: Submit to Firefox AMO
        id: web-ext-submit
        run: |
          # Dynamically detect the build directory starting with "firefox-"
          FIREFOX_DIR=$(find .output -maxdepth 1 -type d -name "firefox-*" | head -n 1)
          echo "Found build directory: $FIREFOX_DIR"
          
          pnpm dlx web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=listed \
            --source-dir="$FIREFOX_DIR" \
            || echo "Submission completed, but immediate signing/download timed out or requires manual review."

      # Upload the signed .xpi as a GitHub Action Artifact if downloaded
      - name: Upload Signed XPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-signed-xpi
          path: web-ext-artifacts/*.xpi
          if-no-files-found: warn

      # Create/Update GitHub Release and upload XPI if immediately approved
      - name: Attach XPI to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          XPI_FILE=$(find web-ext-artifacts -name "*.xpi" | head -n 1)
          if [ -n "$XPI_FILE" ]; then
            echo "Signed XPI found: $XPI_FILE"
            
            # Use pushed tag name or fall back to version in package.json
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG_NAME="${{ github.ref_name }}"
            else
              VERSION=$(node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8')); console.log(pkg.version);")
              TAG_NAME="v$VERSION"
            fi
            echo "Target Release Tag: $TAG_NAME"

            # Retrieve tag annotation, stripping Git comments starting with '#' and trimming whitespace
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" | sed '/^#/d' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            # Check if the release already exists (for robust re-runs)
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME already exists. Uploading/overwriting asset..."
              gh release upload "$TAG_NAME" "$XPI_FILE" --clobber
            else
              if [ -n "$TAG_MSG" ]; then
                echo "Tag message found. Creating a PUBLIC release..."
                echo "Release Notes:"
                echo "$TAG_MSG"
                
                # Create a published (public) release using the tag message
                gh release create "$TAG_NAME" "$XPI_FILE" \
                  --title "$TAG_NAME" \
                  --notes "$TAG_MSG"
              else
                echo "No tag message found. Creating a DRAFT release..."
                
                # Create a draft release
                gh release create "$TAG_NAME" "$XPI_FILE" \
                  --title "$TAG_NAME" \
                  --draft \
                  --notes "Automated draft release for version $TAG_NAME"
              fi
            fi
          else
            echo "⚠️ No signed XPI found. Skip immediate release step."
            echo "If manual review is required, the fallback scheduler will attach the XPI once approved."
          fi

      # Sync your STORE_DESCRIPTION.md to the store page
      - name: Sync Store Description
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: ${{ secrets.AMO_ADDON_ID }}
        run: node .github/scripts/sync-description.js