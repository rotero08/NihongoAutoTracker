<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <pattern id="scanAmber" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="20" height="10" fill="#C78B22"/>
        </pattern>
        <pattern id="scanWhite" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="20" height="10" fill="#EAEAEA"/>
        </pattern>
    </defs>

    <!-- Scanline Amber N-Shape -->
    <path d="M 0 0 H 100 L 500 500 H 360 L 100 175 V 500 H 0 Z" fill="url(#scanAmber)"/>

    <!-- Scanline White T-Shape -->
    <path d="M 150 0 H 500 V 100 H 420 V 375 L 350 287.5 V 100 H 225 Z" fill="url(#scanWhite)"/>

    <!-- Scanline Amber Bottom Triangle -->
    <path d="M 140 305 L 300 500 H 140 Z" fill="url(#scanAmber)"/>
</svg>
