<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <pattern id="dotAmber" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="4" fill="#C78B22"/>
        </pattern>
        <pattern id="dotWhite" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="4" fill="#EAEAEA"/>
        </pattern>
    </defs>

    <!-- The N-Shape -->
    <path d="M 0 0 H 100 L 500 500 H 360 L 100 175 V 500 H 0 Z" fill="url(#dotAmber)"/>

    <!-- The T-Shape -->
