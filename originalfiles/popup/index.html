<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NihongoAutoTracker</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark">
        <img src="/NihongoAutoTracker.svg" style="width:100%; height:100%; object-fit:contain;" alt="NAT" />
      </div>
      <div class="brand-text">
        <div class="brand-name">NihongoAutoTracker</div>
        <div id="api-pill" class="pill pill-off">No API Key</div>
      </div>
    </div>
    <button id="btn-settings" class="icon-btn" title="Open Settings">⚙</button>
  </header>

  <div class="sep"></div>

  <div class="queue-header">
    <div class="queue-header-left">
      <span class="queue-label">QUEUE</span>
      <span id="queue-count" class="badge">0</span>
    </div>
    <div class="queue-bulk" id="queue-bulk" style="display:none">
      <button id="btn-send-all" class="bulk-btn amber">Send All</button>
      <button id="btn-clear-all" class="bulk-btn ghost">Clear</button>
    </div>
  </div>

  <div class="queue-tabs">
    <button class="q-tab active" data-filter="all">All</button>
    <button class="q-tab" data-filter="video">Video</button>
    <button class="q-tab" data-filter="reading">Reading</button>
  </div>

  <div id="queue-list" class="queue-list"></div>

  <div class="sep"></div>

  <footer class="footer">
    <button id="btn-open" class="open-btn">Open Settings</button>
  </footer>

  <div id="status" class="status-toast hidden"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
