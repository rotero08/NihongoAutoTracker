<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NihongoAutoTracker Settings</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>NihongoAutoTracker Config</h1>
    
    <div class="form-group">
      <label>API Key (from NihongoTracker)</label>
      <input type="password" id="api-key" placeholder="Enter API Key..." />
    </div>

    <div class="form-group">
      <label>Default Video Logging Mode</label>
      <select id="log-mode">
        <option value="auto">Automatic</option>
        <option value="manual">Manual Only</option>
      </select>
    </div>

    <div class="form-group">
      <label>Auto-Log Video Threshold (%)</label>
      <input type="number" id="threshold" min="90" max="100" />
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="track-time" /> Track Active Time for Text (Context Menu)
      </label>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="hide-buttons" /> Hide Video Buttons
      </label>
    </div>

    <button id="save-btn">Save Configurations</button>
    <div id="status"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
