<!DOCTYPE html>
<html lang="en" style="background-color: #07070e; color: #dde4f0;">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NihongoAutoTracker</title>
  <script>
    // Synchronously apply the cached theme background before first visual paint
    (function () {
      try {
        const theme = localStorage.getItem('nta-theme-cache') || 'dark-amber';
        const customColors = localStorage.getItem('nta-custom-colors-cache');
        let bg = '#07070e';
        let fg = '#dde4f0';

        if (theme === 'light') {
          bg = '#f4f4f3';
          fg = '#2e3440';
        } else if (customColors) {
          const colors = JSON.parse(customColors);
          if (colors.background || colors.bg) {
            bg = colors.background || colors.bg;
          }
          if (colors.text) {
            fg = colors.text;
          }
        }
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.color = fg;
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <!-- Svelte mounts here -->
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
